name: Build MindReset APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund --no-progress --prefer-offline

      - name: Create Android project
        run: npx cap add android

      - name: Generate signing report (SHA-1 / SHA-256)
        working-directory: android
        run: |
          ./gradlew signingReport | tee signing-report.txt
          echo ""
          echo "===== GOOGLE SIGN-IN FINGERPRINTS ====="
          grep -E "SHA1:|SHA-1:|SHA256:|SHA-256:" signing-report.txt || true
          echo "======================================="

      - name: Set Google Play API target
        run: |
          sed -i 's/compileSdkVersion = [0-9][0-9]*/compileSdkVersion = 36/' android/variables.gradle
          sed -i 's/targetSdkVersion = [0-9][0-9]*/targetSdkVersion = 36/' android/variables.gradle

      - name: Install MindReset native Android plugin
        run: |
          mkdir -p android/app/src/main/java/com/mindreset/app/plugins
          cp native/MindResetUsagePlugin.java android/app/src/main/java/com/mindreset/app/plugins/MindResetUsagePlugin.java
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/java/com/mindreset/app/MainActivity.java')
          s=p.read_text()
          s=s.replace('package com.mindreset.app;\n', 'package com.mindreset.app;\n\nimport android.os.Bundle;\nimport com.mindreset.app.plugins.MindResetUsagePlugin;\n')
          if 'registerPlugin(MindResetUsagePlugin.class)' not in s:
              s=s.replace('public class MainActivity extends BridgeActivity {', 'public class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(Bundle savedInstanceState) {\n        registerPlugin(MindResetUsagePlugin.class);\n        super.onCreate(savedInstanceState);\n    }')
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          if 'android.permission.PACKAGE_USAGE_STATS' not in s:
              s=s.replace('<manifest ', '<manifest ')
              s=s.replace('>\n    <application', '>\n    <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" />\n    <application', 1)
          p.write_text(s)
          PY


      - name: Configure Firebase Android
        env:
          FIREBASE_JSON_B64: ${{ secrets.FIREBASE_JSON_B64 }}
        run: |
          if [ -z "$FIREBASE_JSON_B64" ]; then
            echo "ERROR: GitHub secret FIREBASE_JSON_B64 is not configured." >&2
            exit 1
          fi
          mkdir -p android/app
          echo "$FIREBASE_JSON_B64" | base64 --decode > android/app/google-services.json
          test -s android/app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('android/app/google-services.json')
          d=json.loads(p.read_text())
          project=d.get('project_info',{})
          app=(d.get('client') or [{}])[0]
          print('Firebase project:', project.get('project_id'))
          print('Android package:', ((app.get('client_info') or {}).get('android_client_info') or {}).get('package_name'))
          PY

      - name: Generate app icon
        run: npx @capacitor/assets generate --android --iconBackgroundColor "#1E1F44" --iconBackgroundColorDark "#1E1F44"

      - name: Configure Firebase Google Sign-In dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/variables.gradle')
          s=p.read_text()
          if 'rgcfaIncludeGoogle' not in s:
              s=s.replace('ext {', "ext {\n    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = '1.3.0'")
          p.write_text(s)
          PY

      - name: Configure Google Sign-In dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/variables.gradle')
          s=p.read_text()
          if 'rgcfaIncludeGoogle' not in s:
              s=s.replace('ext {', "ext {\\n    rgcfaIncludeGoogle = true\\n    androidxCredentialsVersion = '1.3.0'")
          p.write_text(s)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply Google Services plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/build.gradle')
          s=p.read_text()
          if 'google-services:4.4.2' not in s:
              s=s.replace('dependencies {', "dependencies {\\n        classpath 'com.google.gms:google-services:4.4.2'")
          p.write_text(s)
          p=Path('android/app/build.gradle')
          s=p.read_text()
          if 'com.google.gms.google-services' not in s:
              s += "\\napply plugin: 'com.google.gms.google-services'\\n"
          p.write_text(s)
          PY

      - name: Apply Google Services Gradle plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('android/build.gradle')
          s=root.read_text()
          if "com.google.gms:google-services" not in s:
              s=s.replace("dependencies {", "dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'")
          root.write_text(s)
          app=Path('android/app/build.gradle')
          s=app.read_text()
          if "com.google.gms.google-services" not in s:
              s += "\n\napply plugin: 'com.google.gms.google-services'\n"
          app.write_text(s)
          PY

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MindReset-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
