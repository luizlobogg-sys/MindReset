name: Build MindReset APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund --no-progress --prefer-offline

      - name: Create Android project
        run: npx cap add android

      - name: Set Android SDK versions
        run: |
          sed -i 's/compileSdkVersion = [0-9][0-9]*/compileSdkVersion = 36/' android/variables.gradle
          sed -i 's/targetSdkVersion = [0-9][0-9]*/targetSdkVersion = 36/' android/variables.gradle

      - name: Configure Firebase Android
        env:
          FIREBASE_JSON_B64: ${{ secrets.FIREBASE_JSON_B64 }}
        run: |
          test -n "$FIREBASE_JSON_B64"
          mkdir -p android/app
          printf '%s' "$FIREBASE_JSON_B64" | base64 --decode > android/app/google-services.json
          test -s android/app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('android/app/google-services.json').read_text())
          project=d.get('project_info', {})
          client=(d.get('client') or [{}])[0]
          package=((client.get('client_info') or {}).get('android_client_info') or {}).get('package_name')
          print('Firebase project:', project.get('project_id'))
          print('Android package:', package)
          if package != 'com.mindreset.app':
              raise SystemExit(f'Wrong Firebase Android package: {package}')
          PY

      - name: Configure Google Sign-In dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/variables.gradle')
          s=p.read_text()
          if 'rgcfaIncludeGoogle' not in s:
              s=s.replace('ext {', "ext {\n    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = '1.3.0'", 1)
          p.write_text(s)
          PY

      - name: Update Capacitor native plugins
        run: npx cap update android

      - name: Install MindReset native Android plugin
        run: |
          mkdir -p android/app/src/main/java/com/mindreset/app/plugins
          cp native/MindResetUsagePlugin.java android/app/src/main/java/com/mindreset/app/plugins/MindResetUsagePlugin.java
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/src/main/java/com/mindreset/app/MainActivity.java')
          s=p.read_text()
          if 'MindResetUsagePlugin' not in s:
              s=s.replace('package com.mindreset.app;','package com.mindreset.app;\n\nimport android.os.Bundle;\nimport com.mindreset.app.plugins.MindResetUsagePlugin;')
              s=s.replace('public class MainActivity extends BridgeActivity {','public class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(Bundle savedInstanceState) {\n        registerPlugin(MindResetUsagePlugin.class);\n        super.onCreate(savedInstanceState);\n    }')
          p.write_text(s)
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          if 'android.permission.PACKAGE_USAGE_STATS' not in s:
              s=re.sub(r'(<manifest[^>]*>)', r'\1\n    <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" />', s, count=1)
          if 'android.permission.PACKAGE_USAGE_STATS' not in s:
              raise SystemExit('PACKAGE_USAGE_STATS permission was not inserted')
          p.write_text(s)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify Usage Access registration
        run: |
          grep -q 'android.permission.PACKAGE_USAGE_STATS' android/app/src/main/AndroidManifest.xml
          grep -q 'MindResetUsagePlugin' android/app/src/main/java/com/mindreset/app/MainActivity.java

      - name: Apply Google Services Gradle plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/build.gradle')
          s=p.read_text()
          if 'com.google.gms:google-services' not in s:
              s=s.replace('dependencies {', "dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'", 1)
          p.write_text(s)
          p=Path('android/app/build.gradle')
          s=p.read_text()
          if 'com.google.gms.google-services' not in s:
              s += "\napply plugin: 'com.google.gms.google-services'\n"
          p.write_text(s)
          PY

      - name: Generate app icon
        run: npx @capacitor/assets generate --android --iconBackgroundColor "#1E1F44" --iconBackgroundColorDark "#1E1F44"

      - name: Generate signing report
        working-directory: android
        run: ./gradlew signingReport | tee signing-report.txt

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MindReset-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  deploy-ai:
    if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' && secrets.GEMINI_API_KEY != '' }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase Functions dependencies
        run: npm --prefix functions install --no-audit --no-fund --no-progress

      - name: Configure Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > firebase-service-account.json
          test -s firebase-service-account.json

      - name: Deploy MindReset AI backend
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-service-account.json
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          printf '%s' "$GEMINI_API_KEY" > gemini-key.txt
          npx firebase-tools functions:secrets:set GEMINI_API_KEY --data-file gemini-key.txt --project mindreset-efc6d --non-interactive
          npx firebase-tools deploy --only functions:mindResetAI --project mindreset-efc6d --non-interactive

      - name: Cleanup credentials
        if: ${{ always() }}
        run: rm -f firebase-service-account.json gemini-key.txt