name: Build MindReset APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      # ==========================================
      # FIREBASE
      # ==========================================

      - name: Create google-services.json
        run: |
          cat > android/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "702721574838",
              "project_id": "mindreset-efc6d",
              "storage_bucket": "mindreset-efc6d.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:702721574838:android:bb1ce645a07337be82a317",
                  "android_client_info": {
                    "package_name": "com.mindreset.app"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "702721574838-5r8trvulppps8drlps3ggqog5e69t3ts.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyBN4sPdVMAcAA7YyhCcUTc_lFyKTCq_E8U"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "702721574838-5r8trvulppps8drlps3ggqog5e69t3ts.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Configure Google Services
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("android/build.gradle")
          app = Path("android/app/build.gradle")

          root_text = root.read_text()
          app_text = app.read_text()

          # Add Google Services classpath to the root Gradle file
          if "com.google.gms:google-services" not in root_text:
              marker = "dependencies {"
              if marker in root_text:
                  root_text = root_text.replace(
                      marker,
                      marker + "\n        classpath 'com.google.gms:google-services:4.4.2'",
                      1
                  )
              else:
                  root_text += """
                  
                  buildscript {
                      dependencies {
                          classpath 'com.google.gms:google-services:4.4.2'
                      }
                  }
                  """

          # Apply Google Services plugin to the Android app
          if "com.google.gms.google-services" not in app_text:
              app_text += """

              apply plugin: 'com.google.gms.google-services'
              """

          root.write_text(root_text)
          app.write_text(app_text)
          PY

      # ==========================================
      # ANDROID
      # ==========================================

      - name: Configure Android API 36
        run: |
          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 36/' android/variables.gradle
          sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 36/' android/variables.gradle

      # ==========================================
      # USAGE ACCESS
      # ==========================================

      - name: Copy native Usage Access plugin
        run: |
          mkdir -p android/app/src/main/java/com/mindreset/app
          cp native/MindResetUsagePlugin.java android/app/src/main/java/com/mindreset/app/MindResetUsagePlugin.java
          sed -i 's/^package .*/package com.mindreset.app;/' android/app/src/main/java/com/mindreset/app/MindResetUsagePlugin.java

      - name: Add Usage Access permission
        run: |
          sed -i '/<application/i\    <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" />' android/app/src/main/AndroidManifest.xml

      - name: Register native plugin
        run: |
          cat > android/app/src/main/java/com/mindreset/app/MainActivity.java <<'EOF'
          package com.mindreset.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(MindResetUsagePlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

      # ==========================================
      # ICONS
      # ==========================================

      - name: Generate app icons
        run: |
          npx @capacitor/assets generate \
            --android \
            --iconBackgroundColor "#1E1F44" \
            --iconBackgroundColorDark "#1E1F44"

      # ==========================================
      # CAPACITOR
      # ==========================================

      - name: Sync Capacitor
        run: npx cap sync android

      # ==========================================
      # VERIFICATIONS
      # ==========================================

      - name: Verify Firebase configuration
        run: |
          echo "Checking Firebase configuration..."
          ls -la android/app/google-services.json
          echo "Checking Firebase project..."
          grep -E '"project_id"|"package_name"|"mobilesdk_app_id"' android/app/google-services.json

      - name: Verify native plugin
        run: |
          echo "Checking native plugin..."
          ls -la android/app/src/main/java/com/mindreset/app/

          echo "Checking package..."
          head -n 5 android/app/src/main/java/com/mindreset/app/MindResetUsagePlugin.java

          echo "Checking permission..."
          grep PACKAGE_USAGE_STATS android/app/src/main/AndroidManifest.xml

      # ==========================================
      # BUILD
      # ==========================================

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # ==========================================
      # UPLOAD
      # ==========================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MindReset-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
