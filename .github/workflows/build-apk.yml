name: Build MindReset APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install npm dependencies
        run: npm install --no-audit --no-fund --no-progress --prefer-offline
      - name: Configure MindReset AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$GEMINI_API_KEY"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('www/ai-config.js').write_text('window.MINDRESET_AI_CONFIG={apiKey:'+json.dumps(os.environ['GEMINI_API_KEY'])+'};\n')
          PY
          test -s www/ai-config.js
      - name: Wire the intended MindReset game runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('www/index.html');s=p.read_text()
          for name in ['mind-games.js','mindreset-game-v2.js','mindreset-games-reference.js','mind-2248.js','ai-fix.js','ai-chat.js','mindreset-core.js']:
              s=re.sub(r'\s*<script[^>]+src=["\']'+re.escape(name)+r'["\'][^>]*></script>','',s)
          tags=''.join('<script src="'+x+'"></script>' for x in ['mindreset-games-reference.js','ai-fix.js','ai-chat.js','mindreset-core.js'])
          s=s.replace('</body>',tags+'</body>',1)
          s=s.replace('MindReset 6.0','MindReset 6.0.1').replace('v6.0.0','v6.0.1')
          p.write_text(s)
          PY
          for f in www/mindreset-games-reference.js www/ai-fix.js www/ai-chat.js www/mindreset-core.js; do test -s "$f"; done
      - name: Verify intended runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('www/index.html').read_text()
          required=['MindReset 6.0.1','v6.0.1','mindreset-games-reference.js','ai-fix.js','ai-chat.js','mindreset-core.js']
          forbidden=['mind-games.js','mind-2248.js','mindreset-game-v2.js']
          for x in required: assert x in s, x
          for x in forbidden: assert x not in s, x
          assert s.count('mindreset-games-reference.js')==1
          print('Runtime OK')
          PY
      - name: Create Android project
        run: npx cap add android
      - name: Set Android SDK and release metadata
        run: |
          sed -i 's/compileSdkVersion = [0-9][0-9]*/compileSdkVersion = 36/' android/variables.gradle
          sed -i 's/targetSdkVersion = [0-9][0-9]*/targetSdkVersion = 36/' android/variables.gradle
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/build.gradle');s=p.read_text()
          s=re.sub(r'versionCode\s+\d+','versionCode 61',s)
          s=re.sub(r'versionName\s+[^\n]+','versionName "6.0.1"',s)
          p.write_text(s)
          PY
      - name: Configure Firebase Android
        env:
          FIREBASE_JSON_B64: ${{ secrets.FIREBASE_JSON_B64 }}
        run: |
          test -n "$FIREBASE_JSON_B64"
          mkdir -p android/app
          echo "$FIREBASE_JSON_B64" | base64 --decode > android/app/google-services.json
          test -s android/app/google-services.json
      - name: Configure Google Sign-In dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/variables.gradle');s=p.read_text()
          if 'rgcfaIncludeGoogle' not in s:s=s.replace('ext {',"ext {\n    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = '1.3.0'",1)
          p.write_text(s)
          PY
      - name: Update Capacitor native plugins
        run: npx cap update android
      - name: Install MindReset native Android plugin
        run: |
          mkdir -p android/app/src/main/java/com/mindreset/app/plugins
          cp native/MindResetUsagePlugin.java android/app/src/main/java/com/mindreset/app/plugins/MindResetUsagePlugin.java
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/src/main/java/com/mindreset/app/MainActivity.java');s=p.read_text()
          if 'MindResetUsagePlugin' not in s:
              s=s.replace('package com.mindreset.app;','package com.mindreset.app;\n\nimport android.os.Bundle;\nimport com.mindreset.app.plugins.MindResetUsagePlugin;')
              s=s.replace('public class MainActivity extends BridgeActivity {','public class MainActivity extends BridgeActivity {\n @Override public void onCreate(Bundle savedInstanceState){ registerPlugin(MindResetUsagePlugin.class); super.onCreate(savedInstanceState); }')
          p.write_text(s)
          p=Path('android/app/src/main/AndroidManifest.xml');s=p.read_text()
          if 'android.permission.PACKAGE_USAGE_STATS' not in s:s=re.sub(r'(<manifest[^>]*>)',r'\1\n <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" />',s,count=1)
          p.write_text(s)
          PY
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Apply Google Services Gradle plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/build.gradle');s=p.read_text()
          if 'com.google.gms:google-services' not in s:s=s.replace('dependencies {',"dependencies {\n classpath 'com.google.gms:google-services:4.4.2'",1)
          p.write_text(s)
          p=Path('android/app/build.gradle');s=p.read_text()
          if 'com.google.gms.google-services' not in s:s+='\napply plugin: \'com.google.gms.google-services\'\n'
          p.write_text(s)
          PY
      - name: Generate app icon
        run: npx @capacitor/assets generate --android --iconBackgroundColor "#1E1F44" --iconBackgroundColorDark "#1E1F44"
      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Generate signing report
        working-directory: android
        run: gradle signingReport --no-daemon --stacktrace
      - name: Build MindReset 6.0.1 APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Upload MindReset 6.0.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: MindReset-6.0.1-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
