name: Fix MindReset splash permanently

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disable blocking splash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('www/index.html')
          s = p.read_text()
          marker = '<style id="mindreset-splash-fix">#splash{display:none!important}</style>'
          if marker not in s:
              s = s.replace('</head>', marker + '</head>', 1)
          p.write_text(s)
          PY
      - name: Commit app fix and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www/index.html
          rm -f .github/workflows/fix-splash.yml
          git add -u .github/workflows/fix-splash.yml
          git diff --cached --quiet || git commit -m "Disable blocking splash screen"
          git push
