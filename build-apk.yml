name: Build MindReset APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: mindreset-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Criar projeto Android Capacitor
        run: npx cap add android

      - name: Sincronizar aplicativo
        run: npx cap sync android

      - name: Compilar APK Debug
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MindReset.apk

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: MindReset-APK
          path: MindReset.apk
          retention-days: 30
